apiVersion: apps/v1
kind: Deployment
metadata:
  name: totem-esg-backend
  labels:
    app.kubernetes.io/name: totem-esg-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: totem-esg-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: totem-esg-backend
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: totem-esg-backend   # nome/tag reais definidos no overlay (images:)
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: totem-esg-backend-config
            - secretRef:
                name: totem-esg-backend-secrets
          # A inicialização aplica migrations e seed antes de abrir a porta.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # dá tempo de o Service tirar o pod da rota antes do SIGTERM (encerramento gracioso)
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
