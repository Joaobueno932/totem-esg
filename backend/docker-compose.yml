# Ambiente local do backend (somente desenvolvimento — credenciais fixas de exemplo).
#   docker compose up -d postgres   → só o PostgreSQL, para rodar a API com npm run dev
#   docker compose up -d --build    → PostgreSQL + API em contêiner (http://localhost:3001)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carbono_zero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbono_zero"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/carbono_zero
      JWT_SECRET: ${JWT_SECRET:-somente-desenvolvimento-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3001:3001"

volumes:
  pgdata:
