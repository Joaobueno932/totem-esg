# Homologação (branch dev). Valores __PREENCHER_*__ dependem da infraestrutura corporativa.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: __PREENCHER_NAMESPACE_HML__

resources:
  - ../../base

images:
  - name: totem-esg-totem
    newName: __PREENCHER_ACR__.azurecr.io/totem-esg-totem
    newTag: __PREENCHER_TAG__   # atualizada pelo processo GitOps a cada build da branch dev

replicas:
  - name: totem-esg-totem
    count: 1
