apiVersion: apps/v1
kind: Deployment
metadata:
  name: totem-esg-totem
  labels:
    app.kubernetes.io/name: totem-esg-totem
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: totem-esg-totem
  template:
    metadata:
      labels:
        app.kubernetes.io/name: totem-esg-totem
        app.kubernetes.io/component: frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # usuário nginx da imagem nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: totem-esg-totem   # nome/tag reais definidos no overlay (images:)
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: totem-esg-totem-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # graváveis com o resto do sistema somente leitura: conf.d recebe a configuração
          # gerada do template na inicialização; /tmp guarda pid e arquivos temporários
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
